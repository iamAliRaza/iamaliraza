  <!-- Tells search engines who this page is about -->

  <meta name="mobile-web-app-capable" content="yes">

  <!--
    Flutter web downloads its rendering engine on first visit, which can leave
    a blank screen for a few seconds while it initializes. This splash spinner
    covers that gap and removes itself as soon as Flutter's first frame mounts.
  -->
  <style>
    /* Black behind the canvas, so any gap iOS Safari leaves around the
       viewport (toolbar, safe area) matches the site instead of showing white. */
    html, body {
      margin: 0;
      background: #000000;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      z-index: 9999;
    }

    #splash .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }

    @keyframes splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <!-- The app draws to a canvas, so this gives crawlers and no-JS visitors real text. -->
  <noscript>
    <h1>Ali Raza</h1>
    <p>Mobile Product Engineer with nine years in Android and Flutter, delivering enterprise apps with AI agents.</p>
    <p><a href="https://github.com/iamAliRaza">GitHub</a> · <a href="https://linkedin.com/in/aliraza--">LinkedIn</a></p>
  </noscript>
  <div id="splash"><div class="spinner"></div></div>
  <script>
    (function () {
      var splash = document.getElementById('splash');
      var removed = false;

      function removeSplash() {
        if (removed || !splash) return;
        removed = true;
        splash.style.transition = 'opacity 0.25s ease';
        splash.style.opacity = '0';
        setTimeout(function () {
          splash.remove();
        }, 300);
      }

      var observer = new MutationObserver(function () {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
          removeSplash();
          observer.disconnect();
        }
      });
      observer.observe(document.body, {childList: true, subtree: true});

      // Fallback in case the observer never fires for any reason.
      setTimeout(removeSplash, 15000);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
